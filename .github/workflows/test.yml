name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-engine/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ai-engine/backend

      - name: Run pytest
        run: python -m pytest -v --tb=short --ignore=test_public_endpoints.py --ignore=e2e_test.py --ignore=test_photo_duplicate.py
        working-directory: ai-engine/backend
        env:
          GIIPS_JWT_SECRET: ci-test-secret
